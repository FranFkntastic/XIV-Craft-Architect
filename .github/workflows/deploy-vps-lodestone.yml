name: Deploy Lodestone Helper to VPS

on:
  push:
    branches: [ main, local-dev ]
    paths:
      - 'src/FFXIV Craft Architect.LodestoneLookup/**'
      - 'src/FFXIV Craft Architect.Core/**'
      - 'src/FFXIV Craft Architect.Web/Services/HttpLodestoneCrafterLookupService.cs'
      - 'src/FFXIV Craft Architect.Web/Program.cs'
      - 'src/FFXIV Craft Architect.Web/wwwroot/appsettings.json'
      - 'tools/Discord/reconcile-guild.mjs'
      - 'global.json'
      - '.github/workflows/deploy-vps-lodestone.yml'
  workflow_dispatch:
    inputs:
      target:
        description: 'Isolated helper target'
        required: true
        default: staging
        type: choice
        options:
          - canonical
          - staging

permissions:
  contents: read

concurrency:
  # Caddy is shared even though the service roots are isolated.
  group: vps-lodestone-helper
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: ${{ ((github.event_name == 'workflow_dispatch' && inputs.target == 'staging') || github.ref_name == 'local-dev') && 'development' || 'production' }}
      url: ${{ ((github.event_name == 'workflow_dispatch' && inputs.target == 'staging') || github.ref_name == 'local-dev') && 'https://dev.xivcraftarchitect.com' || 'https://xivcraftarchitect.com' }}
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
      VPS_SSH_HOST_KEY: ${{ secrets.VPS_SSH_HOST_KEY }}
      VPS_SSH_PORT: 22
    steps:
      - name: Resolve isolated deploy target
        id: target
        shell: bash
        env:
          TARGET_DISCORD_CHANNEL_NAME: ${{ vars.CRAFT_ARCHITECT_DISCORD_CHANNEL_NAME }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            target="${{ inputs.target }}"
            if [[ "$GITHUB_REF_TYPE" != "branch" ]]; then
              echo "Helper deployment requires a branch ref." >&2
              exit 1
            fi
          elif [[ "$GITHUB_REF_NAME" == "local-dev" ]]; then
            target="staging"
          elif [[ "$GITHUB_REF_NAME" == "main" ]]; then
            target="canonical"
          else
            echo "Unsupported helper source branch: $GITHUB_REF_NAME" >&2
            exit 1
          fi

          if [[ "$target" == "canonical" ]]; then
            test "$GITHUB_REF" = "refs/heads/main"
            root="/srv/craftarchitect/services/lodestone"
            service_unit="craftarchitect-lodestone"
            port="5128"
            domain="xivcraftarchitect.com"
            profile_db="$root/data/profile-host.db"
            discord_db="$root/data/discord-collaboration.db"
            channel_name="craft-commissions"
          elif [[ "$target" == "staging" ]]; then
            test "$GITHUB_REF" = "refs/heads/local-dev"
            root="/srv/craftarchitect/services/lodestone-staging"
            service_unit="craftarchitect-lodestone-staging"
            port="5129"
            domain="dev.xivcraftarchitect.com"
            profile_db="$root/data/profile-host.db"
            discord_db="$root/data/discord-collaboration.db"
            channel_name="craft-commissions-staging"
          else
            echo "Unsupported helper target: $target" >&2
            exit 1
          fi

          if [[ -n "$TARGET_DISCORD_CHANNEL_NAME" ]]; then
            [[ "$TARGET_DISCORD_CHANNEL_NAME" =~ ^[a-z0-9_-]{1,100}$ ]]
            channel_name="$TARGET_DISCORD_CHANNEL_NAME"
          fi

          {
            echo "target=$target"
            echo "root=$root"
            echo "service_unit=$service_unit"
            echo "port=$port"
            echo "domain=$domain"
            echo "profile_db=$profile_db"
            echo "discord_db=$discord_db"
            echo "channel_name=$channel_name"
          } >> "$GITHUB_OUTPUT"

      - name: Resolve environment feature flags
        id: features
        shell: bash
        env:
          TARGET_DISCORD_ENABLED: ${{ vars.CRAFT_ARCHITECT_DISCORD_ENABLED }}
          TARGET_PROFILE_HOST_ENABLED: ${{ vars.CRAFT_ARCHITECT_PROFILE_HOST_ENABLED }}
        run: |
          set -euo pipefail
          case "$TARGET_DISCORD_ENABLED" in
            true|false) ;;
            *)
              echo "CRAFT_ARCHITECT_DISCORD_ENABLED must be the literal true or false." >&2
              exit 1
              ;;
          esac
          case "$TARGET_PROFILE_HOST_ENABLED" in
            true|false) ;;
            *)
              echo "CRAFT_ARCHITECT_PROFILE_HOST_ENABLED must be the literal true or false." >&2
              exit 1
              ;;
          esac
          {
            echo "discord_enabled=$TARGET_DISCORD_ENABLED"
            echo "profile_host_enabled=$TARGET_PROFILE_HOST_ENABLED"
          } >> "$GITHUB_OUTPUT"

      - name: Select canonical Discord configuration
        if: steps.features.outputs.discord_enabled == 'true' && steps.target.outputs.target == 'canonical'
        shell: bash
        env:
          TARGET_DISCORD_BOT_TOKEN: ${{ secrets.CA_DISCORD_BOT_TOKEN }}
          TARGET_DISCORD_APPLICATION_ID: ${{ vars.CA_DISCORD_APPLICATION_ID }}
          TARGET_DISCORD_PUBLIC_KEY: ${{ secrets.CA_DISCORD_PUBLIC_KEY }}
          TARGET_DISCORD_GUILD_ID: ${{ secrets.CA_DISCORD_ALLOWED_GUILD_ID }}
          TARGET_DISCORD_CHANNEL_PARENT_ID: ${{ vars.CA_DISCORD_CHANNEL_PARENT_ID }}
        run: |
          set -euo pipefail
          {
            printf 'DISCORD_BOT_TOKEN=%s\n' "$TARGET_DISCORD_BOT_TOKEN"
            printf 'DISCORD_APPLICATION_ID=%s\n' "$TARGET_DISCORD_APPLICATION_ID"
            printf 'DISCORD_PUBLIC_KEY=%s\n' "$TARGET_DISCORD_PUBLIC_KEY"
            printf 'DISCORD_GUILD_ID=%s\n' "$TARGET_DISCORD_GUILD_ID"
            printf 'DISCORD_CHANNEL_PARENT_ID=%s\n' "$TARGET_DISCORD_CHANNEL_PARENT_ID"
          } >> "$GITHUB_ENV"

      - name: Select staging Discord configuration
        if: steps.features.outputs.discord_enabled == 'true' && steps.target.outputs.target == 'staging'
        shell: bash
        env:
          TARGET_DISCORD_BOT_TOKEN: ${{ secrets.CA_DISCORD_STAGING_BOT_TOKEN || secrets.CA_DISCORD_BOT_TOKEN }}
          TARGET_DISCORD_APPLICATION_ID: ${{ vars.CA_DISCORD_STAGING_APPLICATION_ID || vars.CA_DISCORD_APPLICATION_ID }}
          TARGET_DISCORD_PUBLIC_KEY: ${{ secrets.CA_DISCORD_STAGING_PUBLIC_KEY || secrets.CA_DISCORD_PUBLIC_KEY }}
          TARGET_DISCORD_GUILD_ID: ${{ secrets.CA_DISCORD_STAGING_ALLOWED_GUILD_ID || secrets.CA_DISCORD_ALLOWED_GUILD_ID }}
          TARGET_DISCORD_CHANNEL_PARENT_ID: ${{ vars.CA_DISCORD_STAGING_CHANNEL_PARENT_ID || vars.CA_DISCORD_CHANNEL_PARENT_ID }}
        run: |
          set -euo pipefail
          {
            printf 'DISCORD_BOT_TOKEN=%s\n' "$TARGET_DISCORD_BOT_TOKEN"
            printf 'DISCORD_APPLICATION_ID=%s\n' "$TARGET_DISCORD_APPLICATION_ID"
            printf 'DISCORD_PUBLIC_KEY=%s\n' "$TARGET_DISCORD_PUBLIC_KEY"
            printf 'DISCORD_GUILD_ID=%s\n' "$TARGET_DISCORD_GUILD_ID"
            printf 'DISCORD_CHANNEL_PARENT_ID=%s\n' "$TARGET_DISCORD_CHANNEL_PARENT_ID"
          } >> "$GITHUB_ENV"

      - name: Fail closed on missing target configuration
        shell: bash
        env:
          TRADE_COMPANY_ID: ${{ vars.CRAFT_ARCHITECT_TRADE_COMPANY_ID }}
          PROFILE_ID: ${{ vars.CRAFT_ARCHITECT_PROFILE_ID }}
          PROFILE_DISPLAY_NAME: ${{ vars.CRAFT_ARCHITECT_PROFILE_DISPLAY_NAME }}
          PROFILE_ACCESS_KEY: ${{ secrets.CRAFT_ARCHITECT_PROFILE_ACCESS_KEY }}
          TARGET_DISCORD_ENABLED: ${{ steps.features.outputs.discord_enabled }}
          TARGET_PROFILE_HOST_ENABLED: ${{ steps.features.outputs.profile_host_enabled }}
        run: |
          set -euo pipefail
          test -n "$VPS_HOST"
          test -n "$VPS_USER"
          test -n "$VPS_SSH_PRIVATE_KEY"
          test -n "$VPS_SSH_HOST_KEY"
          if [[ "$TARGET_DISCORD_ENABLED" == "true" ]]; then
            test -n "$DISCORD_BOT_TOKEN"
            [[ "$TRADE_COMPANY_ID" =~ ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$ ]]
            test "${TRADE_COMPANY_ID,,}" != "00000000-0000-0000-0000-000000000000"
            [[ "$DISCORD_APPLICATION_ID" =~ ^[0-9]{17,20}$ ]]
            [[ "$DISCORD_GUILD_ID" =~ ^[0-9]{17,20}$ ]]
            [[ "$DISCORD_CHANNEL_PARENT_ID" =~ ^[0-9]{17,20}$ ]]
            test "${#DISCORD_PUBLIC_KEY}" -eq 64
            case "$DISCORD_PUBLIC_KEY" in
              *[!0-9a-fA-F]*) exit 1 ;;
            esac
          fi
          if [[ "$TARGET_PROFILE_HOST_ENABLED" == "true" ]]; then
            [[ "$PROFILE_ID" =~ ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$ ]]
            test "${PROFILE_ID,,}" != "00000000-0000-0000-0000-000000000000"
            test "${#PROFILE_DISPLAY_NAME}" -ge 1
            test "${#PROFILE_DISPLAY_NAME}" -le 120
            test "${#PROFILE_ACCESS_KEY}" -ge 1
            test "${#PROFILE_ACCESS_KEY}" -le 256
          fi

      - name: Checkout immutable source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Verify source and deployment tooling
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
          node --check tools/Discord/reconcile-guild.mjs

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json

      - name: Publish Release helper
        run: >
          dotnet publish "src/FFXIV Craft Architect.LodestoneLookup/FFXIV Craft Architect.LodestoneLookup.csproj"
          --configuration Release
          --runtime linux-x64
          --self-contained true
          --output dist/lodestone

      - name: Package and fingerprint helper
        id: package
        shell: bash
        run: |
          set -euo pipefail
          executable="dist/lodestone/FFXIV Craft Architect.LodestoneLookup"
          test -f "$executable"
          test -f "dist/lodestone/FFXIV Craft Architect.LodestoneLookup.dll"
          release="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_SHA::7}"
          archive="craftarchitect-lodestone-${{ steps.target.outputs.target }}-$release.tar.gz"
          tar -czf "$archive" -C dist/lodestone .
          archive_sha256="$(sha256sum "$archive" | cut -d' ' -f1)"
          tar -tzf "$archive" > archive-contents.txt
          grep -Fq 'FFXIV Craft Architect.LodestoneLookup' archive-contents.txt
          {
            echo "release=$release"
            echo "archive=$archive"
            echo "archive_sha256=$archive_sha256"
          } >> "$GITHUB_OUTPUT"

      - name: Write profile host provisioning environment
        if: steps.features.outputs.profile_host_enabled == 'true'
        shell: bash
        env:
          PROFILE_ID: ${{ vars.CRAFT_ARCHITECT_PROFILE_ID }}
          PROFILE_DISPLAY_NAME: ${{ vars.CRAFT_ARCHITECT_PROFILE_DISPLAY_NAME }}
          PROFILE_ACCESS_KEY: ${{ secrets.CRAFT_ARCHITECT_PROFILE_ACCESS_KEY }}
        run: |
          set -euo pipefail
          umask 077
          {
            printf 'CRAFT_ARCHITECT_PROFILE_ID=%q\n' "$PROFILE_ID"
            printf 'CRAFT_ARCHITECT_PROFILE_DISPLAY_NAME=%q\n' "$PROFILE_DISPLAY_NAME"
            printf 'CRAFT_ARCHITECT_PROFILE_ACCESS_KEY=%q\n' "$PROFILE_ACCESS_KEY"
          } > "profile-host-provisioning-${{ steps.target.outputs.target }}.env"
          test "$(
            stat -c '%a' "profile-host-provisioning-${{ steps.target.outputs.target }}.env"
          )" = "600"

      - name: Reconcile target Discord installation
        if: steps.features.outputs.discord_enabled == 'true'
        id: discord
        env:
          DISCORD_CHANNEL_NAME: ${{ steps.target.outputs.channel_name }}
        run: node tools/Discord/reconcile-guild.mjs

      - name: Write isolated Discord environment
        env:
          TRADE_COMPANY_ID: ${{ vars.CRAFT_ARCHITECT_TRADE_COMPANY_ID }}
          TARGET_DISCORD_ENABLED: ${{ steps.features.outputs.discord_enabled }}
          TARGET_DISCORD_CHANNEL_ID: ${{ steps.discord.outputs.channel_id }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          if [[ "$TARGET_DISCORD_ENABLED" == "true" ]]; then
            [[ "$TARGET_DISCORD_CHANNEL_ID" =~ ^[0-9]{17,20}$ ]]
            {
              printf 'Discord__Enabled=true\n'
              printf 'Discord__CompanyId=%s\n' "$TRADE_COMPANY_ID"
              printf 'Discord__ApplicationId=%s\n' "$DISCORD_APPLICATION_ID"
              printf 'Discord__PublicKey=%s\n' "$DISCORD_PUBLIC_KEY"
              printf 'Discord__RuntimeBotToken=%s\n' "$DISCORD_BOT_TOKEN"
              printf 'Discord__DatabasePath=%s\n' '${{ steps.target.outputs.discord_db }}'
              printf 'Discord__AllowedGuildId=%s\n' "$DISCORD_GUILD_ID"
              printf 'Discord__AllowedChannelId=%s\n' "$TARGET_DISCORD_CHANNEL_ID"
              printf 'Discord__CommissionBaseUrl=https://%s/commission.html?id=\n' '${{ steps.target.outputs.domain }}'
              printf 'CommissionBriefs__PublicPageUrl=https://%s/commission.html\n' '${{ steps.target.outputs.domain }}'
              printf 'CraftAppraisal__Enabled=true\n'
              printf 'CraftAppraisal__CacheDirectory=%s/data/craft-appraisal-cache\n' '${{ steps.target.outputs.root }}'
              printf 'CraftAppraisal__PlanDirectory=%s/data/craft-appraisal-plans\n' '${{ steps.target.outputs.root }}'
              printf 'CraftAppraisal__PublicAppOrigin=https://%s\n' '${{ steps.target.outputs.domain }}'
              printf 'CraftAppraisal__PublicApiOrigin=https://%s/api\n' '${{ steps.target.outputs.domain }}'
            } > "discord-${{ steps.target.outputs.target }}.env"
          else
            {
              printf 'Discord__Enabled=false\n'
              printf 'Discord__DatabasePath=%s\n' '${{ steps.target.outputs.discord_db }}'
              printf 'CommissionBriefs__PublicPageUrl=https://%s/commission.html\n' '${{ steps.target.outputs.domain }}'
              printf 'CraftAppraisal__Enabled=true\n'
              printf 'CraftAppraisal__CacheDirectory=%s/data/craft-appraisal-cache\n' '${{ steps.target.outputs.root }}'
              printf 'CraftAppraisal__PlanDirectory=%s/data/craft-appraisal-plans\n' '${{ steps.target.outputs.root }}'
              printf 'CraftAppraisal__PublicAppOrigin=https://%s\n' '${{ steps.target.outputs.domain }}'
              printf 'CraftAppraisal__PublicApiOrigin=https://%s/api\n' '${{ steps.target.outputs.domain }}'
            } > "discord-${{ steps.target.outputs.target }}.env"
          fi
          test "$(
            stat -c '%a' "discord-${{ steps.target.outputs.target }}.env"
          )" = "600"

      - name: Write isolated remote deploy script
        shell: bash
        run: |
          cat > deploy-lodestone-remote.sh <<'REMOTE'
          set -euo pipefail

          target="$1"
          release="$2"
          archive_name="$3"
          expected_sha="$4"
          root="$5"
          service_unit="$6"
          port="$7"
          profile_db="$8"
          discord_enabled="$9"
          profile_host_enabled="${10}"

          if [[ "$target" == "canonical" ]]; then
            test "$root" = "/srv/craftarchitect/services/lodestone"
            test "$service_unit" = "craftarchitect-lodestone"
            test "$port" = "5128"
            test "$profile_db" = "$root/data/profile-host.db"
          elif [[ "$target" == "staging" ]]; then
            test "$root" = "/srv/craftarchitect/services/lodestone-staging"
            test "$service_unit" = "craftarchitect-lodestone-staging"
            test "$port" = "5129"
            test "$profile_db" = "$root/data/profile-host.db"
          else
            echo "Unsupported remote helper target: $target" >&2
            exit 1
          fi
          case "$discord_enabled" in
            true|false) ;;
            *) echo "Invalid Discord enabled state." >&2; exit 1 ;;
          esac
          case "$profile_host_enabled" in
            true|false) ;;
            *) echo "Invalid Profile Host enabled state." >&2; exit 1 ;;
          esac

          archive="/tmp/$archive_name"
          release_dir="$root/releases/$release"
          staging_dir="$root/releases/.$release.staging"
          executable="$release_dir/FFXIV Craft Architect.LodestoneLookup"
          discord_upload="/tmp/discord-$target.env"
          provisioning_upload="/tmp/profile-host-provisioning-$target.env"
          profile_runtime_upload="/tmp/profile-host-runtime-$target.env"
          cleanup() {
            sudo rm -rf "$staging_dir"
            rm -f \
              "$archive" \
              "$discord_upload" \
              "$provisioning_upload" \
              "$profile_runtime_upload" \
              /tmp/deploy-lodestone-remote.sh
          }
          trap cleanup EXIT

          printf '%s  %s\n' "$expected_sha" "$archive" | sha256sum --check --strict -
          sudo test ! -e "$release_dir"
          sudo test ! -e "$staging_dir"
          sudo mkdir -p "$staging_dir" "$root/data" "$root/env"
          sudo tar -xzf "$archive" -C "$staging_dir"
          sudo test -f "$staging_dir/FFXIV Craft Architect.LodestoneLookup"
          sudo chown -R "$USER:$USER" "$staging_dir" "$root/data" "$root/env"
          sudo chmod +x "$staging_dir/FFXIV Craft Architect.LodestoneLookup"
          sudo mv "$staging_dir" "$release_dir"

          test "$(stat -c '%a' "$discord_upload")" = "600"
          umask 077
          {
            printf 'ProfileHost__Enabled=%s\n' "$profile_host_enabled"
            printf 'ProfileHost__DatabasePath=%s\n' "$profile_db"
          } > "$profile_runtime_upload"
          test "$(stat -c '%a' "$profile_runtime_upload")" = "600"
          sudo install -o "$USER" -g "$USER" -m 600 \
            "$profile_runtime_upload" \
            "$root/env/profile-host.env"
          sudo install -o "$USER" -g "$USER" -m 600 \
            "$discord_upload" \
            "$root/env/discord.env"
          grep -Fxq "ProfileHost__Enabled=$profile_host_enabled" "$root/env/profile-host.env"
          grep -Fxq "ProfileHost__DatabasePath=$profile_db" "$root/env/profile-host.env"
          grep -Fxq "Discord__Enabled=$discord_enabled" "$root/env/discord.env"
          grep -Fxq "CraftAppraisal__Enabled=true" "$root/env/discord.env"

          if [[ "$profile_host_enabled" == "true" ]]; then
            test "$(stat -c '%a' "$provisioning_upload")" = "600"
            set -a
            source "$provisioning_upload"
            set +a
            test -n "$CRAFT_ARCHITECT_PROFILE_ID"
            test -n "$CRAFT_ARCHITECT_PROFILE_DISPLAY_NAME"
            test -n "$CRAFT_ARCHITECT_PROFILE_ACCESS_KEY"
            ProfileHost__DatabasePath="$profile_db" \
              "$executable" \
              profile-host \
              ensure-profile \
              "$CRAFT_ARCHITECT_PROFILE_ID" \
              "$CRAFT_ARCHITECT_PROFILE_DISPLAY_NAME"
            unset CRAFT_ARCHITECT_PROFILE_ACCESS_KEY
          fi

          sudo tee "$root/run-lodestone.sh" > /dev/null <<SCRIPT
          #!/usr/bin/env bash
          set -euo pipefail
          set -a
          source "$root/env/profile-host.env"
          source "$root/env/discord.env"
          set +a
          export ASPNETCORE_URLS="http://127.0.0.1:$port"
          cd "$root/current"
          exec "$root/current/FFXIV Craft Architect.LodestoneLookup"
          SCRIPT
          sudo chmod 755 "$root/run-lodestone.sh"

          sudo tee "/etc/systemd/system/$service_unit.service" > /dev/null <<UNIT
          [Unit]
          Description=Craft Architect helper ($target)
          Wants=network-online.target
          After=network-online.target

          [Service]
          Type=simple
          User=$USER
          Group=$USER
          ExecStart=$root/run-lodestone.sh
          Restart=on-failure
          RestartSec=5
          NoNewPrivileges=true
          PrivateTmp=true

          [Install]
          WantedBy=multi-user.target
          UNIT

          sudo ln -sfn "$release_dir" "$root/current"
          sudo systemctl daemon-reload
          sudo systemctl enable "$service_unit"
          sudo systemctl restart "$service_unit"
          systemctl is-active "$service_unit"
          for attempt in {1..30}; do
            if curl --fail --silent --show-error "http://127.0.0.1:$port/" > /dev/null; then
              break
            fi
            if [[ "$attempt" == "30" ]]; then
              journalctl -u "$service_unit" --no-pager -n 80
              exit 1
            fi
            sleep 1
          done

          caddyfile="/etc/caddy/Caddyfile"
          caddy_candidate="$(mktemp)"
          sudo cat "$caddyfile" > "$caddy_candidate"
          python3 - "$caddy_candidate" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          lines = path.read_text().splitlines(keepends=True)
          targets = {
              "xivcraftarchitect.com": "5128",
              "dev.xivcraftarchitect.com": "5129",
          }
          prefixes = (
              "/api/lodestone",
              "/api/xivdata",
              "/api/discord",
              "/api/profile-host",
              "/api/trade",
              "/api/craft/plans",
          )

          def matching_close(start):
              depth = 0
              for index in range(start, len(lines)):
                  depth += lines[index].count("{") - lines[index].count("}")
                  if depth == 0:
                      return index
              raise SystemExit(f"Unclosed Caddy block at line {start + 1}.")

          for host, port in targets.items():
              anchors = [
                  index
                  for index, line in enumerate(lines)
                  if line.rstrip("\r\n") == f"{host} {{"
              ]
              if len(anchors) != 1:
                  raise SystemExit(f"Expected one Caddy site block for {host}.")
              site_start = anchors[0]
              site_end = matching_close(site_start)
              cursor = site_start + 1
              retained = []
              seen = set()
              while cursor < site_end:
                  stripped = lines[cursor].strip()
                  parts = stripped.split()
                  route = (
                      parts[1].removesuffix("*")
                      if len(parts) == 3 and
                         parts[0] == "handle" and
                         parts[2] == "{"
                      else None
                  )
                  matched = route if route in prefixes else None
                  if matched is None:
                      retained.append(lines[cursor])
                      cursor += 1
                      continue
                  if matched in seen:
                      raise SystemExit(f"Duplicate managed Caddy route for {host} {matched}.")
                  seen.add(matched)
                  cursor = matching_close(cursor) + 1

              routes = "".join(
                  f"\thandle {prefix}* {{\n"
                  "\t\turi strip_prefix /api\n"
                  f"\t\treverse_proxy 127.0.0.1:{port}\n"
                  "\t}\n\n"
                  for prefix in prefixes
              )
              lines[site_start + 1:site_end] = [routes, *retained]

          path.write_text("".join(lines))
          PY
          sudo caddy validate --config "$caddy_candidate" --adapter caddyfile
          if ! sudo cmp --silent "$caddyfile" "$caddy_candidate"; then
            sudo cp --preserve=mode,ownership,timestamps \
              "$caddyfile" \
              "$caddyfile.pre-helper-isolation"
            sudo install -m 644 "$caddy_candidate" "$caddyfile"
            sudo systemctl reload caddy
          fi
          rm -f "$caddy_candidate"

          sudo find "$root/releases" -mindepth 1 -maxdepth 1 -type d -printf '%T@ %p\0' |
            sort -zrn |
            tail -z -n +6 |
            cut -z -d' ' -f2- |
            sudo xargs -0 -r rm -rf
          trap - EXIT
          cleanup
          REMOTE

      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > ~/.ssh/craftarchitect_vps
          chmod 600 ~/.ssh/craftarchitect_vps
          printf '%s\n' "$VPS_SSH_HOST_KEY" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Upload isolated helper release
        shell: bash
        run: |
          set -euo pipefail
          scp -P "$VPS_SSH_PORT" \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            -i ~/.ssh/craftarchitect_vps \
            "${{ steps.package.outputs.archive }}" \
            deploy-lodestone-remote.sh \
            "$VPS_USER@$VPS_HOST:/tmp/"
          ssh -p "$VPS_SSH_PORT" \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            -i ~/.ssh/craftarchitect_vps \
            "$VPS_USER@$VPS_HOST" \
            "rm -f '/tmp/discord-${{ steps.target.outputs.target }}.env'; \
              umask 077; cat > '/tmp/discord-${{ steps.target.outputs.target }}.env'; \
              chmod 600 '/tmp/discord-${{ steps.target.outputs.target }}.env'; \
              test \"\$(stat -c '%a' '/tmp/discord-${{ steps.target.outputs.target }}.env')\" = 600" \
            < "discord-${{ steps.target.outputs.target }}.env"
          if [[ "${{ steps.features.outputs.profile_host_enabled }}" == "true" ]]; then
            ssh -p "$VPS_SSH_PORT" \
              -o BatchMode=yes \
              -o ConnectTimeout=15 \
              -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile=~/.ssh/known_hosts \
              -i ~/.ssh/craftarchitect_vps \
              "$VPS_USER@$VPS_HOST" \
              "rm -f '/tmp/profile-host-provisioning-${{ steps.target.outputs.target }}.env'; \
                umask 077; cat > '/tmp/profile-host-provisioning-${{ steps.target.outputs.target }}.env'; \
                chmod 600 '/tmp/profile-host-provisioning-${{ steps.target.outputs.target }}.env'; \
                test \"\$(stat -c '%a' '/tmp/profile-host-provisioning-${{ steps.target.outputs.target }}.env')\" = 600" \
              < "profile-host-provisioning-${{ steps.target.outputs.target }}.env"
          fi

      - name: Activate isolated helper release
        shell: bash
        run: |
          set -euo pipefail
          ssh -p "$VPS_SSH_PORT" \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            -i ~/.ssh/craftarchitect_vps \
            "$VPS_USER@$VPS_HOST" \
            "bash /tmp/deploy-lodestone-remote.sh \
              '${{ steps.target.outputs.target }}' \
              '${{ steps.package.outputs.release }}' \
              '${{ steps.package.outputs.archive }}' \
              '${{ steps.package.outputs.archive_sha256 }}' \
              '${{ steps.target.outputs.root }}' \
              '${{ steps.target.outputs.service_unit }}' \
              '${{ steps.target.outputs.port }}' \
              '${{ steps.target.outputs.profile_db }}' \
              '${{ steps.features.outputs.discord_enabled }}' \
              '${{ steps.features.outputs.profile_host_enabled }}'"

      - name: Verify target health and configuration
        shell: bash
        env:
          DEPLOY_DOMAIN: ${{ steps.target.outputs.domain }}
          EXPECTED_DISCORD_ENABLED: ${{ steps.features.outputs.discord_enabled }}
          EXPECTED_PROFILE_HOST_ENABLED: ${{ steps.features.outputs.profile_host_enabled }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 3 --retry-all-errors \
            "https://$DEPLOY_DOMAIN/api/lodestone/crafters/search?name=Level%20Checker&world=Behemoth" \
            | grep -q 16331040
          curl --fail --silent --show-error --retry 3 --retry-all-errors \
            "https://$DEPLOY_DOMAIN/api/xivdata/items/search?q=Varn&limit=12" \
            | grep -qi varn
          test "$(
            curl --silent --show-error \
              --output /dev/null \
              --write-out '%{http_code}' \
              --request POST \
              --header 'Content-Type: application/json' \
              --data '{"type":1}' \
              "https://$DEPLOY_DOMAIN/api/discord/interactions"
          )" = "$(
            if [[ "$EXPECTED_DISCORD_ENABLED" == "true" ]]; then
              printf 401
            else
              printf 404
            fi
          )"
          curl --fail --silent --show-error \
            "https://$DEPLOY_DOMAIN/api/discord/health" \
            --output discord-health.json
          node --input-type=module -e '
            import { readFile } from "node:fs/promises";
            const health = JSON.parse(await readFile("discord-health.json", "utf8"));
            const enabled = process.env.EXPECTED_DISCORD_ENABLED === "true";
            const expected = enabled
              ? {
                  status: "ready",
                  signingReady: true,
                  publishingReady: true,
                  directPublishingReady: true
                }
              : {
                  status: "disabled",
                  signingReady: false,
                  publishingReady: false,
                  directPublishingReady: false
                };
            for (const [key, value] of Object.entries(expected)) {
              if (health?.[key] !== value) process.exit(1);
            }
          '
          curl --fail --silent --show-error \
            "https://$DEPLOY_DOMAIN/api/profile-host/health" \
            --output profile-host-health.json
          node --input-type=module -e '
            import { readFile } from "node:fs/promises";
            const health = JSON.parse(await readFile("profile-host-health.json", "utf8"));
            const enabled = process.env.EXPECTED_PROFILE_HOST_ENABLED === "true";
            if (health?.status !== "ready") process.exit(1);
            if (health?.profileHostEnabled !== enabled) process.exit(1);
          '
          test "$(
            curl --silent --show-error \
              --output /dev/null \
              --write-out '%{http_code}' \
              "https://$DEPLOY_DOMAIN/api/trade/v1/companies/00000000-0000-0000-0000-000000000001/discord/claims"
          )" = "$(
            if [[ "$EXPECTED_DISCORD_ENABLED" == "true" ]]; then
              printf 401
            else
              printf 404
            fi
          )"
          test "$(
            curl --silent --show-error \
              --output /dev/null \
              --write-out '%{http_code}' \
              "https://$DEPLOY_DOMAIN/api/craft/plans/not-a-plan"
          )" = "404"
