name: Deploy Lodestone Helper to VPS

on:
  push:
    branches: [ main, local-dev ]
    paths:
      - 'src/FFXIV Craft Architect.LodestoneLookup/**'
      - 'src/FFXIV Craft Architect.Core/**'
      - 'src/FFXIV Craft Architect.Web/Services/HttpLodestoneCrafterLookupService.cs'
      - 'src/FFXIV Craft Architect.Web/Program.cs'
      - 'src/FFXIV Craft Architect.Web/wwwroot/appsettings.json'
      - 'tools/Discord/reconcile-guild.mjs'
      - 'tools/Deployment/**'
      - 'global.json'
      - 'Directory.Build.props'
      - 'eng/Franthropy.version'
      - '.github/workflows/deploy-vps-lodestone.yml'
  workflow_dispatch:
    inputs:
      target:
        description: 'Isolated helper target'
        required: true
        default: staging
        type: choice
        options:
          - canonical
          - staging
      reconsolidate_profile_host:
        description: 'One-time canonical credential migration and route cutover'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  # Caddy is shared even though the service roots are isolated.
  group: vps-lodestone-helper
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: ${{ ((github.event_name == 'workflow_dispatch' && inputs.target == 'staging') || github.ref_name == 'local-dev') && 'development' || 'production' }}
      url: ${{ ((github.event_name == 'workflow_dispatch' && inputs.target == 'staging') || github.ref_name == 'local-dev') && 'https://dev.xivcraftarchitect.com' || 'https://xivcraftarchitect.com' }}
    env:
      FranthropyRoot: /tmp/franthropy
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
      VPS_SSH_HOST_KEY: ${{ secrets.VPS_SSH_HOST_KEY }}
      VPS_SSH_PORT: 22
    steps:
      - name: Resolve isolated deploy target
        id: target
        shell: bash
        env:
          TARGET_DISCORD_CHANNEL_NAME: ${{ vars.CRAFT_ARCHITECT_DISCORD_CHANNEL_NAME }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            target="${{ inputs.target }}"
            if [[ "$GITHUB_REF_TYPE" != "branch" ]]; then
              echo "Helper deployment requires a branch ref." >&2
              exit 1
            fi
          elif [[ "$GITHUB_REF_NAME" == "local-dev" ]]; then
            target="staging"
          elif [[ "$GITHUB_REF_NAME" == "main" ]]; then
            target="canonical"
          else
            echo "Unsupported helper source branch: $GITHUB_REF_NAME" >&2
            exit 1
          fi

          if [[ "$target" == "canonical" ]]; then
            test "$GITHUB_REF" = "refs/heads/main"
            root="/srv/craftarchitect/services/lodestone"
            service_unit="craftarchitect-lodestone"
            port="5128"
            domain="xivcraftarchitect.com"
            profile_db="$root/data/profile-host.db"
            discord_db="$root/data/discord-collaboration.db"
            channel_name="craft-commissions"
          elif [[ "$target" == "staging" ]]; then
            test "$GITHUB_REF" = "refs/heads/local-dev"
            root="/srv/craftarchitect/services/lodestone-staging"
            service_unit="craftarchitect-lodestone-staging"
            port="5129"
            domain="dev.xivcraftarchitect.com"
            profile_db="$root/data/profile-host.db"
            discord_db="$root/data/discord-collaboration.db"
            channel_name="craft-commissions-staging"
          else
            echo "Unsupported helper target: $target" >&2
            exit 1
          fi

          if [[ -n "$TARGET_DISCORD_CHANNEL_NAME" ]]; then
            [[ "$TARGET_DISCORD_CHANNEL_NAME" =~ ^[a-z0-9_-]{1,100}$ ]]
            channel_name="$TARGET_DISCORD_CHANNEL_NAME"
          fi

          {
            echo "target=$target"
            echo "root=$root"
            echo "service_unit=$service_unit"
            echo "port=$port"
            echo "domain=$domain"
            echo "profile_db=$profile_db"
            echo "discord_db=$discord_db"
            echo "channel_name=$channel_name"
          } >> "$GITHUB_OUTPUT"

      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > ~/.ssh/craftarchitect_vps
          chmod 600 ~/.ssh/craftarchitect_vps
          printf '%s\n' "$VPS_SSH_HOST_KEY" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Read canonical Profile Host authority marker
        id: canonical-authority
        shell: bash
        run: |
          set -euo pipefail
          canonicalized="$(
            ssh -p "$VPS_SSH_PORT" \
              -o BatchMode=yes \
              -o ConnectTimeout=15 \
              -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile=~/.ssh/known_hosts \
              -i ~/.ssh/craftarchitect_vps \
              "$VPS_USER@$VPS_HOST" \
              "if sudo test -f /srv/craftarchitect/services/profile-host-canonicalized-v1; then printf true; else printf false; fi"
          )"
          case "$canonicalized" in
            true|false) ;;
            *) echo "The VPS returned an invalid Profile Host authority state." >&2; exit 1 ;;
          esac
          echo "Profile Host canonicalization marker present: $canonicalized"
          reconsolidation_requested="${{ github.event_name == 'workflow_dispatch' && inputs.reconsolidate_profile_host || false }}"
          case "$reconsolidation_requested" in
            true|false) ;;
            *) echo "The Profile Host reconsolidation request is invalid." >&2; exit 1 ;;
          esac
          if [[ "$reconsolidation_requested" == "true" ]]; then
            test "${{ steps.target.outputs.target }}" = "canonical"
            test "$canonicalized" = "false"
          fi
          {
            echo "profile_host_canonicalized=$canonicalized"
            echo "reconsolidation_requested=$reconsolidation_requested"
          } >> "$GITHUB_OUTPUT"

      - name: Resolve environment feature flags
        id: features
        shell: bash
        env:
          TARGET_DISCORD_ENABLED: ${{ vars.CRAFT_ARCHITECT_DISCORD_ENABLED }}
          TARGET_PROFILE_HOST_ENABLED: ${{ vars.CRAFT_ARCHITECT_PROFILE_HOST_ENABLED }}
          PROFILE_HOST_CANONICALIZED: ${{ steps.canonical-authority.outputs.profile_host_canonicalized }}
          DEPLOY_TARGET: ${{ steps.target.outputs.target }}
        run: |
          set -euo pipefail
          case "$TARGET_DISCORD_ENABLED" in
            true|false) ;;
            *)
              echo "CRAFT_ARCHITECT_DISCORD_ENABLED must be the literal true or false." >&2
              exit 1
              ;;
          esac
          case "$TARGET_PROFILE_HOST_ENABLED" in
            true|false) ;;
            *)
              echo "CRAFT_ARCHITECT_PROFILE_HOST_ENABLED must be the literal true or false." >&2
              exit 1
              ;;
          esac
          runtime_profile_host_enabled="$TARGET_PROFILE_HOST_ENABLED"
          if [[ "$DEPLOY_TARGET" == "staging" && "$PROFILE_HOST_CANONICALIZED" == "true" ]]; then
            runtime_profile_host_enabled="false"
          fi
          if [[ "$DEPLOY_TARGET" == "canonical" &&
                "$PROFILE_HOST_CANONICALIZED" == "true" &&
                "$runtime_profile_host_enabled" != "true" ]]; then
            echo "The canonical Profile Host cannot be disabled after reconsolidation." >&2
            exit 1
          fi
          {
            echo "discord_enabled=$TARGET_DISCORD_ENABLED"
            echo "profile_host_enabled=$runtime_profile_host_enabled"
          } >> "$GITHUB_OUTPUT"

      - name: Select canonical Discord configuration
        if: steps.features.outputs.discord_enabled == 'true' && steps.target.outputs.target == 'canonical'
        shell: bash
        env:
          TARGET_DISCORD_BOT_TOKEN: ${{ secrets.CA_DISCORD_BOT_TOKEN }}
          TARGET_DISCORD_APPLICATION_ID: ${{ vars.CA_DISCORD_APPLICATION_ID }}
          TARGET_DISCORD_PUBLIC_KEY: ${{ secrets.CA_DISCORD_PUBLIC_KEY }}
          TARGET_DISCORD_GUILD_ID: ${{ secrets.CA_DISCORD_ALLOWED_GUILD_ID }}
          TARGET_DISCORD_CHANNEL_PARENT_ID: ${{ vars.CA_DISCORD_CHANNEL_PARENT_ID }}
        run: |
          set -euo pipefail
          {
            printf 'DISCORD_BOT_TOKEN=%s\n' "$TARGET_DISCORD_BOT_TOKEN"
            printf 'DISCORD_APPLICATION_ID=%s\n' "$TARGET_DISCORD_APPLICATION_ID"
            printf 'DISCORD_PUBLIC_KEY=%s\n' "$TARGET_DISCORD_PUBLIC_KEY"
            printf 'DISCORD_GUILD_ID=%s\n' "$TARGET_DISCORD_GUILD_ID"
            printf 'DISCORD_CHANNEL_PARENT_ID=%s\n' "$TARGET_DISCORD_CHANNEL_PARENT_ID"
          } >> "$GITHUB_ENV"

      - name: Select staging Discord configuration
        if: steps.features.outputs.discord_enabled == 'true' && steps.target.outputs.target == 'staging'
        shell: bash
        env:
          TARGET_DISCORD_BOT_TOKEN: ${{ secrets.CA_DISCORD_STAGING_BOT_TOKEN || secrets.CA_DISCORD_BOT_TOKEN }}
          TARGET_DISCORD_APPLICATION_ID: ${{ vars.CA_DISCORD_STAGING_APPLICATION_ID || vars.CA_DISCORD_APPLICATION_ID }}
          TARGET_DISCORD_PUBLIC_KEY: ${{ secrets.CA_DISCORD_STAGING_PUBLIC_KEY || secrets.CA_DISCORD_PUBLIC_KEY }}
          TARGET_DISCORD_GUILD_ID: ${{ secrets.CA_DISCORD_STAGING_ALLOWED_GUILD_ID || secrets.CA_DISCORD_ALLOWED_GUILD_ID }}
          TARGET_DISCORD_CHANNEL_PARENT_ID: ${{ vars.CA_DISCORD_STAGING_CHANNEL_PARENT_ID || vars.CA_DISCORD_CHANNEL_PARENT_ID }}
        run: |
          set -euo pipefail
          {
            printf 'DISCORD_BOT_TOKEN=%s\n' "$TARGET_DISCORD_BOT_TOKEN"
            printf 'DISCORD_APPLICATION_ID=%s\n' "$TARGET_DISCORD_APPLICATION_ID"
            printf 'DISCORD_PUBLIC_KEY=%s\n' "$TARGET_DISCORD_PUBLIC_KEY"
            printf 'DISCORD_GUILD_ID=%s\n' "$TARGET_DISCORD_GUILD_ID"
            printf 'DISCORD_CHANNEL_PARENT_ID=%s\n' "$TARGET_DISCORD_CHANNEL_PARENT_ID"
          } >> "$GITHUB_ENV"

      - name: Fail closed on missing target configuration
        shell: bash
        env:
          TRADE_COMPANY_ID: ${{ vars.CRAFT_ARCHITECT_TRADE_COMPANY_ID }}
          PROFILE_ID: ${{ vars.CRAFT_ARCHITECT_PROFILE_ID }}
          PROFILE_DISPLAY_NAME: ${{ vars.CRAFT_ARCHITECT_PROFILE_DISPLAY_NAME }}
          PROFILE_ACCESS_KEY: ${{ secrets.CRAFT_ARCHITECT_PROFILE_ACCESS_KEY }}
          TARGET_DISCORD_ENABLED: ${{ steps.features.outputs.discord_enabled }}
          TARGET_PROFILE_HOST_ENABLED: ${{ steps.features.outputs.profile_host_enabled }}
        run: |
          set -euo pipefail
          test -n "$VPS_HOST"
          test -n "$VPS_USER"
          test -n "$VPS_SSH_PRIVATE_KEY"
          test -n "$VPS_SSH_HOST_KEY"
          if [[ "$TARGET_DISCORD_ENABLED" == "true" ]]; then
            test -n "$DISCORD_BOT_TOKEN"
            [[ "$TRADE_COMPANY_ID" =~ ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$ ]]
            test "${TRADE_COMPANY_ID,,}" != "00000000-0000-0000-0000-000000000000"
            [[ "$DISCORD_APPLICATION_ID" =~ ^[0-9]{17,20}$ ]]
            [[ "$DISCORD_GUILD_ID" =~ ^[0-9]{17,20}$ ]]
            [[ "$DISCORD_CHANNEL_PARENT_ID" =~ ^[0-9]{17,20}$ ]]
            test "${#DISCORD_PUBLIC_KEY}" -eq 64
            case "$DISCORD_PUBLIC_KEY" in
              *[!0-9a-fA-F]*) exit 1 ;;
            esac
          fi
          if [[ "$TARGET_PROFILE_HOST_ENABLED" == "true" ]]; then
            [[ "$PROFILE_ID" =~ ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$ ]]
            test "${PROFILE_ID,,}" != "00000000-0000-0000-0000-000000000000"
            test "${#PROFILE_DISPLAY_NAME}" -ge 1
            test "${#PROFILE_DISPLAY_NAME}" -le 120
            test "${#PROFILE_ACCESS_KEY}" -ge 1
            test "${#PROFILE_ACCESS_KEY}" -le 256
          fi

      - name: Checkout immutable source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Verify source and deployment tooling
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
          node --check tools/Discord/reconcile-guild.mjs
          PYTHONDONTWRITEBYTECODE=1 \
            python3 -m unittest discover -s tools/Deployment/tests -p 'test_*.py'

      - name: Checkout pinned Franthropy dependency
        shell: bash
        run: |
          set -euo pipefail
          revision="$(tr -d '[:space:]' < eng/Franthropy.version)"
          git init "$FranthropyRoot"
          git -C "$FranthropyRoot" remote add origin https://github.com/FranFkntastic/Franthropy.git
          git -C "$FranthropyRoot" fetch --depth=1 origin "$revision"
          git -C "$FranthropyRoot" checkout --detach FETCH_HEAD
          test "$(git -C "$FranthropyRoot" rev-parse HEAD)" = "$revision"

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json

      - name: Publish Release helper
        run: >
          dotnet publish "src/FFXIV Craft Architect.LodestoneLookup/FFXIV Craft Architect.LodestoneLookup.csproj"
          --configuration Release
          --runtime linux-x64
          --self-contained true
          --output dist/lodestone

      - name: Package and fingerprint helper
        id: package
        shell: bash
        run: |
          set -euo pipefail
          executable="dist/lodestone/FFXIV Craft Architect.LodestoneLookup"
          test -f "$executable"
          test -f "dist/lodestone/FFXIV Craft Architect.LodestoneLookup.dll"
          release="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_SHA::7}"
          archive="craftarchitect-lodestone-${{ steps.target.outputs.target }}-$release.tar.gz"
          tar -czf "$archive" -C dist/lodestone .
          archive_sha256="$(sha256sum "$archive" | cut -d' ' -f1)"
          tar -tzf "$archive" > archive-contents.txt
          grep -Fq 'FFXIV Craft Architect.LodestoneLookup' archive-contents.txt
          {
            echo "release=$release"
            echo "archive=$archive"
            echo "archive_sha256=$archive_sha256"
          } >> "$GITHUB_OUTPUT"

      - name: Write profile host provisioning environment
        if: steps.features.outputs.profile_host_enabled == 'true'
        shell: bash
        env:
          PROFILE_ID: ${{ vars.CRAFT_ARCHITECT_PROFILE_ID }}
          PROFILE_DISPLAY_NAME: ${{ vars.CRAFT_ARCHITECT_PROFILE_DISPLAY_NAME }}
          PROFILE_ACCESS_KEY: ${{ secrets.CRAFT_ARCHITECT_PROFILE_ACCESS_KEY }}
        run: |
          set -euo pipefail
          umask 077
          {
            printf 'CRAFT_ARCHITECT_PROFILE_ID=%q\n' "$PROFILE_ID"
            printf 'CRAFT_ARCHITECT_PROFILE_DISPLAY_NAME=%q\n' "$PROFILE_DISPLAY_NAME"
            printf 'CRAFT_ARCHITECT_PROFILE_ACCESS_KEY=%q\n' "$PROFILE_ACCESS_KEY"
          } > "profile-host-provisioning-${{ steps.target.outputs.target }}.env"
          test "$(
            stat -c '%a' "profile-host-provisioning-${{ steps.target.outputs.target }}.env"
          )" = "600"

      - name: Reconcile target Discord installation
        if: steps.features.outputs.discord_enabled == 'true'
        id: discord
        env:
          DISCORD_CHANNEL_NAME: ${{ steps.target.outputs.channel_name }}
        run: node tools/Discord/reconcile-guild.mjs

      - name: Write isolated Discord environment
        env:
          TRADE_COMPANY_ID: ${{ vars.CRAFT_ARCHITECT_TRADE_COMPANY_ID }}
          TARGET_DISCORD_ENABLED: ${{ steps.features.outputs.discord_enabled }}
          TARGET_DISCORD_CHANNEL_ID: ${{ steps.discord.outputs.channel_id }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          if [[ "$TARGET_DISCORD_ENABLED" == "true" ]]; then
            [[ "$TARGET_DISCORD_CHANNEL_ID" =~ ^[0-9]{17,20}$ ]]
            {
              printf 'Discord__Enabled=true\n'
              printf 'Discord__CompanyId=%s\n' "$TRADE_COMPANY_ID"
              printf 'Discord__ApplicationId=%s\n' "$DISCORD_APPLICATION_ID"
              printf 'Discord__PublicKey=%s\n' "$DISCORD_PUBLIC_KEY"
              printf 'Discord__RuntimeBotToken=%s\n' "$DISCORD_BOT_TOKEN"
              printf 'Discord__DatabasePath=%s\n' '${{ steps.target.outputs.discord_db }}'
              printf 'Discord__AllowedGuildId=%s\n' "$DISCORD_GUILD_ID"
              printf 'Discord__AllowedChannelId=%s\n' "$TARGET_DISCORD_CHANNEL_ID"
              printf 'Discord__CommissionBaseUrl=https://%s/commission.html?id=\n' '${{ steps.target.outputs.domain }}'
              printf 'CommissionBriefs__PublicPageUrl=https://%s/commission.html\n' '${{ steps.target.outputs.domain }}'
              printf 'CraftAppraisal__Enabled=true\n'
              printf 'CraftAppraisal__CacheDirectory=%s/data/craft-appraisal-cache\n' '${{ steps.target.outputs.root }}'
              printf 'CraftAppraisal__PlanDirectory=%s/data/craft-appraisal-plans\n' '${{ steps.target.outputs.root }}'
              printf 'CraftAppraisal__PublicAppOrigin=https://%s\n' '${{ steps.target.outputs.domain }}'
              printf 'CraftAppraisal__PublicApiOrigin=https://%s/api\n' '${{ steps.target.outputs.domain }}'
            } > "discord-${{ steps.target.outputs.target }}.env"
          else
            {
              printf 'Discord__Enabled=false\n'
              printf 'Discord__DatabasePath=%s\n' '${{ steps.target.outputs.discord_db }}'
              printf 'CommissionBriefs__PublicPageUrl=https://%s/commission.html\n' '${{ steps.target.outputs.domain }}'
              printf 'CraftAppraisal__Enabled=true\n'
              printf 'CraftAppraisal__CacheDirectory=%s/data/craft-appraisal-cache\n' '${{ steps.target.outputs.root }}'
              printf 'CraftAppraisal__PlanDirectory=%s/data/craft-appraisal-plans\n' '${{ steps.target.outputs.root }}'
              printf 'CraftAppraisal__PublicAppOrigin=https://%s\n' '${{ steps.target.outputs.domain }}'
              printf 'CraftAppraisal__PublicApiOrigin=https://%s/api\n' '${{ steps.target.outputs.domain }}'
            } > "discord-${{ steps.target.outputs.target }}.env"
          fi
          test "$(
            stat -c '%a' "discord-${{ steps.target.outputs.target }}.env"
          )" = "600"

      - name: Write isolated remote deploy script
        shell: bash
        run: |
          cat > deploy-lodestone-remote.sh <<'REMOTE'
          set -euo pipefail

          target="$1"
          release="$2"
          archive_name="$3"
          expected_sha="$4"
          root="$5"
          service_unit="$6"
          port="$7"
          profile_db="$8"
          discord_enabled="$9"
          profile_host_enabled="${10}"
          profile_host_canonicalized="${11}"
          reconsolidation_requested="${12}"

          if [[ "$target" == "canonical" ]]; then
            test "$root" = "/srv/craftarchitect/services/lodestone"
            test "$service_unit" = "craftarchitect-lodestone"
            test "$port" = "5128"
            test "$profile_db" = "$root/data/profile-host.db"
          elif [[ "$target" == "staging" ]]; then
            test "$root" = "/srv/craftarchitect/services/lodestone-staging"
            test "$service_unit" = "craftarchitect-lodestone-staging"
            test "$port" = "5129"
            test "$profile_db" = "$root/data/profile-host.db"
          else
            echo "Unsupported remote helper target: $target" >&2
            exit 1
          fi
          case "$discord_enabled" in
            true|false) ;;
            *) echo "Invalid Discord enabled state." >&2; exit 1 ;;
          esac
          case "$profile_host_enabled" in
            true|false) ;;
            *) echo "Invalid Profile Host enabled state." >&2; exit 1 ;;
          esac
          case "$profile_host_canonicalized" in
            true|false) ;;
            *) echo "Invalid Profile Host canonicalization state." >&2; exit 1 ;;
          esac
          case "$reconsolidation_requested" in
            true|false) ;;
            *) echo "Invalid Profile Host reconsolidation request." >&2; exit 1 ;;
          esac
          canonicalization_marker="/srv/craftarchitect/services/profile-host-canonicalized-v1"
          observed_canonicalized="false"
          if sudo test -f "$canonicalization_marker"; then
            observed_canonicalized="true"
          fi
          test "$profile_host_canonicalized" = "$observed_canonicalized"
          runtime_profile_host_enabled="$profile_host_enabled"
          if [[ "$target" == "staging" && "$profile_host_canonicalized" == "true" ]]; then
            runtime_profile_host_enabled="false"
          fi
          if [[ "$target" == "canonical" &&
                "$profile_host_canonicalized" == "true" &&
                "$runtime_profile_host_enabled" != "true" ]]; then
            echo "The canonical Profile Host cannot be disabled after reconsolidation." >&2
            exit 1
          fi
          if [[ "$reconsolidation_requested" == "true" ]]; then
            test "$target" = "canonical"
            test "$profile_host_canonicalized" = "false"
            test "$runtime_profile_host_enabled" = "true"
          fi

          archive="/tmp/$archive_name"
          release_dir="$root/releases/$release"
          staging_dir="$root/releases/.$release.staging"
          executable="$release_dir/FFXIV Craft Architect.LodestoneLookup"
          discord_upload="/tmp/discord-$target.env"
          provisioning_upload="/tmp/profile-host-provisioning-$target.env"
          profile_runtime_upload="/tmp/profile-host-runtime-$target.env"
          caddy_rewriter="/tmp/rewrite_caddy_helper_routes.py"
          cutover_started="false"
          cutover_complete="false"
          cutover_canonical_exposed="false"
          cutover_backup_dir=""
          canonical_previous_release=""
          staging_previous_release=""
          rollback_cutover() {
            set +e
            rollback_failed="false"
            if ! sudo systemctl stop craftarchitect-lodestone craftarchitect-lodestone-staging; then
              rollback_failed="true"
            fi
            if [[ "$cutover_canonical_exposed" == "true" ]]; then
              echo "Cutover failed after canonical exposure; preserving canonical writes and fencing staging." >&2
              staging_fail_forward_candidate="$(mktemp)"
              {
                printf 'ProfileHost__Enabled=false\n'
                printf 'ProfileHost__DatabasePath=%s\n' \
                  /srv/craftarchitect/services/lodestone-staging/data/profile-host.db
              } > "$staging_fail_forward_candidate"
              chmod 600 "$staging_fail_forward_candidate"
              if ! sudo install -o "$USER" -g "$USER" -m 600 \
                "$staging_fail_forward_candidate" \
                /srv/craftarchitect/services/lodestone-staging/env/profile-host.env; then
                rollback_failed="true"
              fi
              rm -f "$staging_fail_forward_candidate"
              if ! sudo ln -sfn "$release_dir" \
                /srv/craftarchitect/services/lodestone/current; then
                rollback_failed="true"
              fi
              if ! sudo install -m 644 "$caddy_candidate" /etc/caddy/Caddyfile; then
                rollback_failed="true"
              elif ! sudo caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile; then
                rollback_failed="true"
              elif ! sudo systemctl reload caddy; then
                rollback_failed="true"
              fi
              fail_forward_marker_candidate="$(mktemp)"
              printf '%s fail-forward\n' "$release" > "$fail_forward_marker_candidate"
              if ! sudo install -o "$USER" -g "$USER" -m 644 \
                "$fail_forward_marker_candidate" \
                "$canonicalization_marker"; then
                rollback_failed="true"
              fi
              rm -f "$fail_forward_marker_candidate"
              if ! sudo systemctl daemon-reload; then
                rollback_failed="true"
              fi
              if ! sudo systemctl start craftarchitect-lodestone; then
                rollback_failed="true"
              fi
              if ! sudo systemctl stop craftarchitect-lodestone-staging; then
                rollback_failed="true"
              fi
              if ! systemctl is-active craftarchitect-lodestone; then
                rollback_failed="true"
              fi
              if systemctl is-active craftarchitect-lodestone-staging; then
                rollback_failed="true"
              fi
              for canonical_health in \
                https://xivcraftarchitect.com/api/profile-host/health \
                https://dev.xivcraftarchitect.com/api/profile-host/health; do
                authority_ready="false"
                for attempt in {1..10}; do
                  if curl --fail --silent --show-error "$canonical_health" \
                    | python3 -c '
          import json
          import sys
          health = json.load(sys.stdin)
          if health.get("status") != "ready" or health.get("profileHostEnabled") is not True:
              raise SystemExit("Canonical Profile Host authority is not ready.")
          '; then
                    authority_ready="true"
                    break
                  fi
                  sleep 1
                done
                if [[ "$authority_ready" != "true" ]]; then
                  rollback_failed="true"
                fi
              done
              if [[ "$rollback_failed" == "true" ]]; then
                echo "Post-exposure fail-forward is incomplete; staging fencing and the authority marker were attempted and require operator inspection." >&2
                return 1
              fi
              echo "Post-exposure fail-forward completed; canonical authority is retained and staging is fenced." >&2
              return 0
            fi

            if [[ "$cutover_canonical_exposed" != "true" ]]; then
              if ! sudo rm -f \
                /srv/craftarchitect/services/lodestone/data/profile-host.db-wal \
                /srv/craftarchitect/services/lodestone/data/profile-host.db-shm \
                /srv/craftarchitect/services/lodestone-staging/data/profile-host.db-wal \
                /srv/craftarchitect/services/lodestone-staging/data/profile-host.db-shm; then
                rollback_failed="true"
              fi
              if [[ -f "$cutover_backup_dir/canonical-profile-host.db" ]]; then
                if ! sudo install -o "$USER" -g "$USER" -m 600 \
                  "$cutover_backup_dir/canonical-profile-host.db" \
                  /srv/craftarchitect/services/lodestone/data/profile-host.db; then
                  rollback_failed="true"
                fi
              fi
              if [[ -f "$cutover_backup_dir/staging-profile-host.db" ]]; then
                if ! sudo install -o "$USER" -g "$USER" -m 600 \
                  "$cutover_backup_dir/staging-profile-host.db" \
                  /srv/craftarchitect/services/lodestone-staging/data/profile-host.db; then
                  rollback_failed="true"
                fi
              fi
              for restored_db in \
                /srv/craftarchitect/services/lodestone/data/profile-host.db \
                /srv/craftarchitect/services/lodestone-staging/data/profile-host.db; do
                if ! python3 - "$restored_db" <<'PY'
          import sqlite3
          import sys
          connection = sqlite3.connect(f"file:{sys.argv[1]}?mode=ro", uri=True)
          try:
              result = connection.execute("PRAGMA quick_check").fetchone()
              if result is None or result[0] != "ok":
                  raise SystemExit(f"SQLite rollback validation failed: {result!r}")
          finally:
              connection.close()
          PY
                then
                  rollback_failed="true"
                fi
              done
            fi
            if [[ -f "$cutover_backup_dir/staging-profile-host.env" ]]; then
              if ! sudo install -o "$USER" -g "$USER" -m 600 \
                "$cutover_backup_dir/staging-profile-host.env" \
                /srv/craftarchitect/services/lodestone-staging/env/profile-host.env; then
                rollback_failed="true"
              fi
            fi
            if [[ -n "$canonical_previous_release" ]]; then
              if ! sudo ln -sfn "$canonical_previous_release" \
                /srv/craftarchitect/services/lodestone/current; then
                rollback_failed="true"
              fi
            fi
            if [[ -n "$staging_previous_release" ]]; then
              if ! sudo ln -sfn "$staging_previous_release" \
                /srv/craftarchitect/services/lodestone-staging/current; then
                rollback_failed="true"
              fi
            fi
            if [[ -f "$cutover_backup_dir/Caddyfile" ]]; then
              if ! sudo install -m 644 "$cutover_backup_dir/Caddyfile" /etc/caddy/Caddyfile; then
                rollback_failed="true"
              elif ! sudo caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile; then
                rollback_failed="true"
              elif ! sudo systemctl reload caddy; then
                rollback_failed="true"
              fi
            fi
            if ! sudo systemctl daemon-reload; then
              rollback_failed="true"
            fi
            if ! sudo systemctl restart craftarchitect-lodestone craftarchitect-lodestone-staging; then
              rollback_failed="true"
            fi
            for restored_service in craftarchitect-lodestone craftarchitect-lodestone-staging; do
              if ! systemctl is-active "$restored_service"; then
                rollback_failed="true"
              fi
            done
            for restored_endpoint in http://127.0.0.1:5128/ http://127.0.0.1:5129/; do
              if ! curl --fail --silent --show-error --retry 10 --retry-delay 1 \
                --retry-connrefused "$restored_endpoint" > /dev/null; then
                rollback_failed="true"
              fi
            done
            if [[ "$rollback_failed" == "true" ]]; then
              echo "Cutover rollback was incomplete; fencing staging to prevent split authority." >&2
              rollback_marker_candidate="$(mktemp)"
              printf '%s rollback-incomplete\n' "$release" > "$rollback_marker_candidate"
              sudo install -o "$USER" -g "$USER" -m 644 \
                "$rollback_marker_candidate" \
                "$canonicalization_marker"
              rm -f "$rollback_marker_candidate"
              staging_fail_closed_candidate="$(mktemp)"
              {
                printf 'ProfileHost__Enabled=false\n'
                printf 'ProfileHost__DatabasePath=%s\n' \
                  /srv/craftarchitect/services/lodestone-staging/data/profile-host.db
              } > "$staging_fail_closed_candidate"
              chmod 600 "$staging_fail_closed_candidate"
              sudo install -o "$USER" -g "$USER" -m 600 \
                "$staging_fail_closed_candidate" \
                /srv/craftarchitect/services/lodestone-staging/env/profile-host.env
              rm -f "$staging_fail_closed_candidate"
              sudo systemctl stop craftarchitect-lodestone-staging
              return 1
            fi
            return 0
          }
          cleanup() {
            cleanup_status="$?"
            trap - EXIT
            set +e
            if [[ "$cutover_started" == "true" && "$cutover_complete" != "true" ]]; then
              if ! rollback_cutover; then
                cleanup_status=1
              fi
            fi
            sudo rm -rf "$staging_dir"
            rm -f \
              "$archive" \
              "$discord_upload" \
              "$provisioning_upload" \
              "$profile_runtime_upload" \
              "$caddy_rewriter" \
              /tmp/deploy-lodestone-remote.sh
            exit "$cleanup_status"
          }
          trap cleanup EXIT

          backup_sqlite() {
            sudo python3 - "$1" "$2" <<'PY'
          import sqlite3
          import sys
          source = sqlite3.connect(f"file:{sys.argv[1]}?mode=ro", uri=True)
          destination = sqlite3.connect(sys.argv[2])
          try:
              source.backup(destination)
              result = destination.execute("PRAGMA quick_check").fetchone()
              if result is None or result[0] != "ok":
                  raise SystemExit(f"SQLite backup validation failed: {result!r}")
          finally:
              destination.close()
              source.close()
          PY
          }

          printf '%s  %s\n' "$expected_sha" "$archive" | sha256sum --check --strict -
          sudo test ! -e "$release_dir"
          sudo test ! -e "$staging_dir"
          sudo mkdir -p "$staging_dir" "$root/data" "$root/env"
          sudo tar -xzf "$archive" -C "$staging_dir"
          sudo test -f "$staging_dir/FFXIV Craft Architect.LodestoneLookup"
          sudo chown -R "$USER:$USER" "$staging_dir" "$root/data" "$root/env"
          sudo chmod +x "$staging_dir/FFXIV Craft Architect.LodestoneLookup"
          sudo mv "$staging_dir" "$release_dir"

          test "$(stat -c '%a' "$discord_upload")" = "600"
          umask 077
          {
            printf 'ProfileHost__Enabled=%s\n' "$runtime_profile_host_enabled"
            printf 'ProfileHost__DatabasePath=%s\n' "$profile_db"
          } > "$profile_runtime_upload"
          test "$(stat -c '%a' "$profile_runtime_upload")" = "600"
          sudo install -o "$USER" -g "$USER" -m 600 \
            "$profile_runtime_upload" \
            "$root/env/profile-host.env"
          sudo install -o "$USER" -g "$USER" -m 600 \
            "$discord_upload" \
            "$root/env/discord.env"
          grep -Fxq "ProfileHost__Enabled=$runtime_profile_host_enabled" "$root/env/profile-host.env"
          grep -Fxq "ProfileHost__DatabasePath=$profile_db" "$root/env/profile-host.env"
          grep -Fxq "Discord__Enabled=$discord_enabled" "$root/env/discord.env"
          grep -Fxq "CraftAppraisal__Enabled=true" "$root/env/discord.env"

          if [[ "$runtime_profile_host_enabled" == "true" ]]; then
            test "$(stat -c '%a' "$provisioning_upload")" = "600"
            set -a
            source "$provisioning_upload"
            set +a
            test -n "$CRAFT_ARCHITECT_PROFILE_ID"
            test -n "$CRAFT_ARCHITECT_PROFILE_DISPLAY_NAME"
            test -n "$CRAFT_ARCHITECT_PROFILE_ACCESS_KEY"
            if [[ "$reconsolidation_requested" != "true" ]]; then
              ProfileHost__DatabasePath="$profile_db" \
                "$executable" \
                profile-host \
                ensure-profile \
                "$CRAFT_ARCHITECT_PROFILE_ID" \
                "$CRAFT_ARCHITECT_PROFILE_DISPLAY_NAME"
              unset CRAFT_ARCHITECT_PROFILE_ACCESS_KEY
            fi
          fi

          sudo tee "$root/run-lodestone.sh" > /dev/null <<SCRIPT
          #!/usr/bin/env bash
          set -euo pipefail
          set -a
          source "$root/env/profile-host.env"
          source "$root/env/discord.env"
          set +a
          export ASPNETCORE_URLS="http://127.0.0.1:$port"
          cd "$root/current"
          exec "$root/current/FFXIV Craft Architect.LodestoneLookup"
          SCRIPT
          sudo chmod 755 "$root/run-lodestone.sh"

          sudo tee "/etc/systemd/system/$service_unit.service" > /dev/null <<UNIT
          [Unit]
          Description=Craft Architect helper ($target)
          Wants=network-online.target
          After=network-online.target

          [Service]
          Type=simple
          User=$USER
          Group=$USER
          ExecStart=$root/run-lodestone.sh
          Restart=on-failure
          RestartSec=5
          NoNewPrivileges=true
          PrivateTmp=true

          [Install]
          WantedBy=multi-user.target
          UNIT

          caddyfile="/etc/caddy/Caddyfile"
          caddy_candidate="$(mktemp)"
          sudo cat "$caddyfile" > "$caddy_candidate"
          python3 "$caddy_rewriter" \
            --caddyfile "$caddy_candidate" \
            --target "$target" \
            --canonicalized "$(
              if [[ "$reconsolidation_requested" == "true" ]]; then
                printf true
              else
                printf %s "$profile_host_canonicalized"
              fi
            )"
          sudo caddy validate --config "$caddy_candidate" --adapter caddyfile

          if [[ "$reconsolidation_requested" == "true" ]]; then
            staging_root="/srv/craftarchitect/services/lodestone-staging"
            staging_db="$staging_root/data/profile-host.db"
            staging_profile_env="$staging_root/env/profile-host.env"
            canonical_previous_release="$(readlink -f "$root/current")"
            staging_previous_release="$(readlink -f "$staging_root/current")"
            test -d "$canonical_previous_release"
            test -d "$staging_previous_release"
            test -f "$profile_db"
            test -f "$staging_db"
            test -f "$staging_profile_env"
            systemctl is-active craftarchitect-lodestone
            systemctl is-active craftarchitect-lodestone-staging
            cutover_backup_dir="$root/data/reconsolidation-backups/$release"
            sudo test ! -e "$cutover_backup_dir"
            sudo mkdir -p "$cutover_backup_dir"
            sudo chown "$USER:$USER" "$cutover_backup_dir"
            sudo chmod 700 "$cutover_backup_dir"

            cutover_started="true"
            sudo systemctl stop craftarchitect-lodestone craftarchitect-lodestone-staging
            backup_sqlite "$profile_db" "$cutover_backup_dir/canonical-profile-host.db"
            backup_sqlite "$staging_db" "$cutover_backup_dir/staging-profile-host.db"
            sudo cp --preserve=mode,ownership,timestamps \
              "$caddyfile" \
              "$cutover_backup_dir/Caddyfile"
            sudo cp --preserve=mode,ownership,timestamps \
              "$staging_profile_env" \
              "$cutover_backup_dir/staging-profile-host.env"

            ProfileHost__DatabasePath="$profile_db" \
              "$executable" \
              profile-host \
              ensure-profile \
              "$CRAFT_ARCHITECT_PROFILE_ID" \
              "$CRAFT_ARCHITECT_PROFILE_DISPLAY_NAME"
            unset CRAFT_ARCHITECT_PROFILE_ACCESS_KEY

            ProfileHost__DatabasePath="$profile_db" \
              "$executable" \
              profile-host \
              import-active-credentials \
              "$staging_db" \
              "$CRAFT_ARCHITECT_PROFILE_ID" \
              "$CRAFT_ARCHITECT_PROFILE_DISPLAY_NAME" \
              > "$cutover_backup_dir/credential-import-result.json"
            python3 - "$cutover_backup_dir/credential-import-result.json" <<'PY'
          import json
          import sys
          with open(sys.argv[1], encoding="utf-8") as stream:
              result = json.load(stream)
          source = result.get("sourceActiveKeyCount")
          inserted = result.get("insertedKeyCount")
          present = result.get("alreadyPresentKeyCount")
          if not isinstance(source, int) or source < 1:
              raise SystemExit("Credential import reported no active source keys.")
          if not isinstance(inserted, int) or not isinstance(present, int):
              raise SystemExit("Credential import counts are missing.")
          if inserted + present != source:
              raise SystemExit("Credential import counts do not reconcile.")
          PY

            staging_profile_candidate="$(mktemp)"
            {
              printf 'ProfileHost__Enabled=false\n'
              printf 'ProfileHost__DatabasePath=%s\n' "$staging_db"
            } > "$staging_profile_candidate"
            chmod 600 "$staging_profile_candidate"

            sudo ln -sfn "$release_dir" "$root/current"
            sudo install -o "$USER" -g "$USER" -m 600 \
              "$staging_profile_candidate" \
              "$staging_profile_env"
            rm -f "$staging_profile_candidate"
            sudo install -m 644 "$caddy_candidate" "$caddyfile"
            sudo systemctl daemon-reload
            sudo systemctl enable craftarchitect-lodestone craftarchitect-lodestone-staging
            cutover_canonical_exposed="true"
            sudo systemctl reload caddy
            sudo systemctl start craftarchitect-lodestone craftarchitect-lodestone-staging
            systemctl is-active craftarchitect-lodestone
            systemctl is-active craftarchitect-lodestone-staging

            for endpoint in http://127.0.0.1:5128/ http://127.0.0.1:5129/; do
              for attempt in {1..30}; do
                if curl --fail --silent --show-error "$endpoint" > /dev/null; then
                  break
                fi
                if [[ "$attempt" == "30" ]]; then
                  journalctl -u craftarchitect-lodestone --no-pager -n 80
                  journalctl -u craftarchitect-lodestone-staging --no-pager -n 80
                  exit 1
                fi
                sleep 1
              done
            done
            for public_health in \
              https://xivcraftarchitect.com/api/profile-host/health \
              https://dev.xivcraftarchitect.com/api/profile-host/health; do
              for attempt in {1..30}; do
                if curl --fail --silent --show-error "$public_health" \
                  | python3 -c '
          import json
          import sys
          health = json.load(sys.stdin)
          if health.get("status") != "ready" or health.get("profileHostEnabled") is not True:
              raise SystemExit("Public Profile Host route is not served by canonical authority.")
          '; then
                  break
                fi
                if [[ "$attempt" == "30" ]]; then
                  journalctl -u craftarchitect-lodestone --no-pager -n 80
                  journalctl -u craftarchitect-lodestone-staging --no-pager -n 80
                  exit 1
                fi
                sleep 1
              done
            done
            for direct in '5128:true' '5129:false'; do
              direct_port="${direct%%:*}"
              expected_enabled="${direct##*:}"
              curl --fail --silent --show-error \
                "http://127.0.0.1:$direct_port/profile-host/health" \
                | EXPECTED_ENABLED="$expected_enabled" python3 -c '
          import json
          import os
          import sys
          health = json.load(sys.stdin)
          expected = os.environ["EXPECTED_ENABLED"] == "true"
          if health.get("status") != "ready" or health.get("profileHostEnabled") is not expected:
              raise SystemExit("Profile Host runtime authority does not match the cutover.")
          '
            done

            marker_candidate="$(mktemp)"
            printf '%s\n' "$release" > "$marker_candidate"
            sudo install -o "$USER" -g "$USER" -m 644 \
              "$marker_candidate" \
              "$canonicalization_marker"
            rm -f "$marker_candidate"
            cutover_complete="true"
          else
            sudo ln -sfn "$release_dir" "$root/current"
            sudo systemctl daemon-reload
            sudo systemctl enable "$service_unit"
            sudo systemctl restart "$service_unit"
            systemctl is-active "$service_unit"
            for attempt in {1..30}; do
              if curl --fail --silent --show-error "http://127.0.0.1:$port/" > /dev/null; then
                break
              fi
              if [[ "$attempt" == "30" ]]; then
                journalctl -u "$service_unit" --no-pager -n 80
                exit 1
              fi
              sleep 1
            done
            if [[ "$target" == "staging" && "$profile_host_canonicalized" == "true" ]]; then
              curl --fail --silent --show-error \
                "http://127.0.0.1:$port/profile-host/health" \
                | python3 -c '
          import json
          import sys
          health = json.load(sys.stdin)
          if health.get("status") != "ready" or health.get("profileHostEnabled") is not False:
              raise SystemExit("Staging Profile Host remained enabled after canonicalization.")
          '
            fi
            if ! sudo cmp --silent "$caddyfile" "$caddy_candidate"; then
              sudo cp --preserve=mode,ownership,timestamps \
                "$caddyfile" \
                "$caddyfile.pre-helper-isolation.$release"
              sudo install -m 644 "$caddy_candidate" "$caddyfile"
              sudo systemctl reload caddy
            fi
          fi
          rm -f "$caddy_candidate"

          sudo find "$root/releases" -mindepth 1 -maxdepth 1 -type d -printf '%T@ %p\0' |
            sort -zrn |
            tail -z -n +6 |
            cut -z -d' ' -f2- |
            sudo xargs -0 -r rm -rf
          trap - EXIT
          cleanup
          REMOTE

      - name: Upload isolated helper release
        shell: bash
        run: |
          set -euo pipefail
          scp -P "$VPS_SSH_PORT" \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            -i ~/.ssh/craftarchitect_vps \
            "${{ steps.package.outputs.archive }}" \
            deploy-lodestone-remote.sh \
            tools/Deployment/rewrite_caddy_helper_routes.py \
            "$VPS_USER@$VPS_HOST:/tmp/"
          ssh -p "$VPS_SSH_PORT" \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            -i ~/.ssh/craftarchitect_vps \
            "$VPS_USER@$VPS_HOST" \
            "rm -f '/tmp/discord-${{ steps.target.outputs.target }}.env'; \
              umask 077; cat > '/tmp/discord-${{ steps.target.outputs.target }}.env'; \
              chmod 600 '/tmp/discord-${{ steps.target.outputs.target }}.env'; \
              test \"\$(stat -c '%a' '/tmp/discord-${{ steps.target.outputs.target }}.env')\" = 600" \
            < "discord-${{ steps.target.outputs.target }}.env"
          if [[ "${{ steps.features.outputs.profile_host_enabled }}" == "true" ]]; then
            ssh -p "$VPS_SSH_PORT" \
              -o BatchMode=yes \
              -o ConnectTimeout=15 \
              -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile=~/.ssh/known_hosts \
              -i ~/.ssh/craftarchitect_vps \
              "$VPS_USER@$VPS_HOST" \
              "rm -f '/tmp/profile-host-provisioning-${{ steps.target.outputs.target }}.env'; \
                umask 077; cat > '/tmp/profile-host-provisioning-${{ steps.target.outputs.target }}.env'; \
                chmod 600 '/tmp/profile-host-provisioning-${{ steps.target.outputs.target }}.env'; \
                test \"\$(stat -c '%a' '/tmp/profile-host-provisioning-${{ steps.target.outputs.target }}.env')\" = 600" \
              < "profile-host-provisioning-${{ steps.target.outputs.target }}.env"
          fi

      - name: Activate isolated helper release
        shell: bash
        run: |
          set -euo pipefail
          ssh -p "$VPS_SSH_PORT" \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            -i ~/.ssh/craftarchitect_vps \
            "$VPS_USER@$VPS_HOST" \
            "bash /tmp/deploy-lodestone-remote.sh \
              '${{ steps.target.outputs.target }}' \
              '${{ steps.package.outputs.release }}' \
              '${{ steps.package.outputs.archive }}' \
              '${{ steps.package.outputs.archive_sha256 }}' \
              '${{ steps.target.outputs.root }}' \
              '${{ steps.target.outputs.service_unit }}' \
              '${{ steps.target.outputs.port }}' \
              '${{ steps.target.outputs.profile_db }}' \
              '${{ steps.features.outputs.discord_enabled }}' \
              '${{ steps.features.outputs.profile_host_enabled }}' \
              '${{ steps.canonical-authority.outputs.profile_host_canonicalized }}' \
              '${{ steps.canonical-authority.outputs.reconsolidation_requested }}'"

      - name: Verify target health and configuration
        shell: bash
        env:
          DEPLOY_DOMAIN: ${{ steps.target.outputs.domain }}
          EXPECTED_DISCORD_ENABLED: ${{ steps.features.outputs.discord_enabled }}
          EXPECTED_PROFILE_HOST_ENABLED: ${{ steps.features.outputs.profile_host_enabled }}
          PROFILE_HOST_CANONICALIZED: ${{ steps.canonical-authority.outputs.profile_host_canonicalized }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 3 --retry-all-errors \
            "https://$DEPLOY_DOMAIN/api/lodestone/crafters/search?name=Level%20Checker&world=Behemoth" \
            | grep -q 16331040
          curl --fail --silent --show-error --retry 3 --retry-all-errors \
            "https://$DEPLOY_DOMAIN/api/xivdata/items/search?q=Varn&limit=12" \
            | grep -qi varn
          test "$(
            curl --silent --show-error \
              --output /dev/null \
              --write-out '%{http_code}' \
              --request POST \
              --header 'Content-Type: application/json' \
              --data '{"type":1}' \
              "https://$DEPLOY_DOMAIN/api/discord/interactions"
          )" = "$(
            if [[ "$EXPECTED_DISCORD_ENABLED" == "true" ]]; then
              printf 401
            else
              printf 404
            fi
          )"
          curl --fail --silent --show-error \
            "https://$DEPLOY_DOMAIN/api/discord/health" \
            --output discord-health.json
          node --input-type=module -e '
            import { readFile } from "node:fs/promises";
            const health = JSON.parse(await readFile("discord-health.json", "utf8"));
            const enabled = process.env.EXPECTED_DISCORD_ENABLED === "true";
            const expected = enabled
              ? {
                  status: "ready",
                  signingReady: true,
                  publishingReady: true,
                  directPublishingReady: true
                }
              : {
                  status: "disabled",
                  signingReady: false,
                  publishingReady: false,
                  directPublishingReady: false
                };
            for (const [key, value] of Object.entries(expected)) {
              if (health?.[key] !== value) process.exit(1);
            }
          '
          curl --fail --silent --show-error \
            "https://$DEPLOY_DOMAIN/api/profile-host/health" \
            --output profile-host-health.json
          node --input-type=module -e '
            import { readFile } from "node:fs/promises";
            const health = JSON.parse(await readFile("profile-host-health.json", "utf8"));
            const enabled = process.env.PROFILE_HOST_CANONICALIZED === "true"
              ? true
              : process.env.EXPECTED_PROFILE_HOST_ENABLED === "true";
            if (health?.status !== "ready") process.exit(1);
            if (health?.profileHostEnabled !== enabled) process.exit(1);
          '
          test "$(
            curl --silent --show-error \
              --output /dev/null \
              --write-out '%{http_code}' \
              "https://$DEPLOY_DOMAIN/api/trade/v1/companies/00000000-0000-0000-0000-000000000001/discord/claims"
          )" = "404"
          test "$(
            curl --silent --show-error \
              --output /dev/null \
              --write-out '%{http_code}' \
              "https://$DEPLOY_DOMAIN/api/craft/plans/not-a-plan"
          )" = "404"
